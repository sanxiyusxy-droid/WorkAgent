name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Coverage regression gates
        run: npm run test:cov

  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node: ['20', '22']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests (incl. recovery, escape, kill-point suites)
        run: npm test

      - name: Build (embeds source commit)
        run: npm run build

      - name: Secret scan (tracked source and package output)
        # CI must scan the clean checkout rather than its empty staged set.
        # The scanner also fails closed if no eligible files are selected.
        run: npm run secret-scan:package

      - name: Package content allowlist
        # fail the pipeline if the tarball would ship .agent sessions,
        # journals, evidence, configs or any non-allowlisted file
        run: npm run check:package

      - name: Install from packed tarball
        shell: bash
        run: |
          # The workflow runs lifecycle gates explicitly in verify/offline-eval;
          # avoid repeating tests/evaluations six more times via this hook.
          npm pack --ignore-scripts
          TGZ=$(ls code-agent-*.tgz)
          mkdir ../install-check
          cd ../install-check
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE/$TGZ" --no-audit --no-fund
          node node_modules/code-agent/dist/agent.mjs --version
          node node_modules/code-agent/dist/agent.mjs --help >/dev/null

  offline-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Release tag matches package version
        run: npm run check:release-tag
      - name: Standard npm pack lifecycle (includes offline release gates)
        shell: bash
        run: |
          # Do not pass --ignore-scripts here: this single job must prove the
          # real npm lifecycle executes prepack, including eval:ci --no-write.
          npm pack
          TGZ=$(ls code-agent-*.tgz)
          test -f "$TGZ"
          diff -u \
            <(printf '%s\n' \
              package/LICENSE \
              package/README.md \
              package/dist/agent \
              package/dist/agent.cmd \
              package/dist/agent.mjs \
              package/package.json | sort) \
            <(tar -tzf "$TGZ" | sort)
          test ! -d eval/results
